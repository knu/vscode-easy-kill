name: CI

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - name: Run tests
        run: xvfb-run -a npm test
        if: runner.os == 'Linux'
      - name: Run tests
        run: npm test
        if: runner.os != 'Linux'

  test-gate:
    name: Test
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          test "$RESULT" = success

  package:
    name: Package extension
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      vsce-enabled: ${{ steps.registries.outputs.vsce-enabled }}
      ovsx-enabled: ${{ steps.registries.outputs.ovsx-enabled }}
      marketplace-url: ${{ steps.metadata.outputs.marketplace-url }}
      open-vsx-url: ${{ steps.metadata.outputs.open-vsx-url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - run: npm run package
      - name: Read publication URLs
        id: metadata
        run: |
          jq -r '
            "marketplace-url=https://marketplace.visualstudio.com/items?itemName=\(.publisher).\(.name)",
            "open-vsx-url=https://open-vsx.org/extension/\(.publisher)/\(.name)/\(.version)"
          ' package.json >> "$GITHUB_OUTPUT"
      - name: Upload extension package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 7
      - name: Check configured registries
        id: registries
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            echo "vsce-enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "vsce-enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$OVSX_PAT" ]; then
            echo "ovsx-enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "ovsx-enabled=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-releases
      url: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - name: Download extension package
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" ./*.vsix --repo "$GITHUB_REPOSITORY" --generate-notes

  publish-vsce:
    name: Publish to VS Code Marketplace
    needs: package
    if: needs.package.outputs.vsce-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: vscode-marketplace
      url: ${{ needs.package.outputs.marketplace-url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Download extension package
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-vsix
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npm run publish:vsce

  publish-ovsx:
    name: Publish to Open VSX Registry
    needs: package
    if: needs.package.outputs.ovsx-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: open-vsx
      url: ${{ needs.package.outputs.open-vsx-url }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci
      - name: Download extension package
        uses: actions/download-artifact@v8.0.2
        with:
          name: extension-vsix
      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npm run publish:ovsx
